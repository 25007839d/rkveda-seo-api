name: SEO Audit Worker

on:
  workflow_dispatch:
    inputs:
      audit_id:
        description: "SEO Audit ID"
        required: true
        type: string

jobs:
  seo-audit:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run SEO audit worker
        env:
          AUDIT_ID: ${{ inputs.audit_id }}
          API_BASE_URL: https://api.rkveda.in
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: node worker.js